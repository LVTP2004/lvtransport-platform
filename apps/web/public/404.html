<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LV Transport — Pagina niet gevonden</title>
  <style>
    :root { --bg:#202124; --panel:#121212; --gold:#d4af37; --text:#f6e7b2; --muted:#d7c89b; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1c1c1c 0%,var(--bg) 55%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);padding:24px}
    .card{max-width:760px;width:100%;background:rgba(18,18,18,.9);border:1px solid rgba(212,175,55,.35);border-radius:24px;padding:28px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
    .logo{height:52px;margin-bottom:14px}.code{color:var(--gold);letter-spacing:.22em;font-size:.78rem;text-transform:uppercase}
    h1{margin:.4rem 0 0;font-size:2rem}p{color:var(--muted);line-height:1.55}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.btn{display:inline-flex;padding:11px 16px;border-radius:12px;border:1px solid rgba(212,175,55,.5);text-decoration:none;color:var(--text);font-weight:600}
    .btn.primary{background:linear-gradient(135deg,#d4af37,#b8942f);color:#111;border:none}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/brand/lv-logo-header.svg" alt="LV Transport" />
    <div class="code">Error 404</div>
    <h1>Deze route is niet beschikbaar.</h1>
    <p>De opgevraagde pagina bestaat niet of is verplaatst. Gebruik onderstaande knoppen om snel terug te keren naar de operationele LV Transport routes.</p>
    <div class="actions">
      <a class="btn" href="/">Terug naar startpagina</a>
      <a class="btn primary" href="/booking.html">Boek uw rit</a>
      <a class="btn" href="/tracking.html">Volg uw taxi</a>
    </div>
  </main>
</body>
</html>
