# Root-domain production block for lvtransport.be
# Copy to /etc/nginx/sites-available/lvtransport-root.conf on VPS

server {
    listen 80;
    listen [::]:80;
    server_name lvtransport.be www.lvtransport.be;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ACME challenge for certbot webroot flow
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
}
