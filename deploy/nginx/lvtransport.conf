# LVTP consolidated production Nginx virtual hosts.
# Install as single source of truth for lvtransport.be routing.
# Verified operational production runtime: api.lvtransport.be -> 127.0.0.1:3000.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream lvtp_api_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name lvtransport.be www.lvtransport.be api.lvtransport.be admin.lvtransport.be driver.lvtransport.be app.lvtransport.be;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name lvtransport.be www.lvtransport.be;

  root /var/www/lvtp-app;
  index index.html;


  # Founder cockpit public exposure on app domain.
  location ^~ /founder {
    root /var/www/lvtp-admin;
    try_files $uri $uri/ /index.html;
  }

  location = /control-tower {
    return 302 /founder;
  }

  location = /operations {
    return 302 /founder/cockpit;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.lvtransport.be;

  location / {
    proxy_pass http://lvtp_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://lvtp_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.lvtransport.be;

  root /var/www/lvtp-admin;
  index index.html;


  # Founder cockpit public exposure on app domain.
  location ^~ /founder {
    root /var/www/lvtp-admin;
    try_files $uri $uri/ /index.html;
  }

  location = /control-tower {
    return 302 /founder;
  }

  location = /operations {
    return 302 /founder/cockpit;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name driver.lvtransport.be app.lvtransport.be;

  root /var/www/lvtp-driver;
  index index.html;


  # Founder cockpit public exposure on app domain.
  location ^~ /founder {
    root /var/www/lvtp-admin;
    try_files $uri $uri/ /index.html;
  }

  location = /control-tower {
    return 302 /founder;
  }

  location = /operations {
    return 302 /founder/cockpit;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
