name: LVTransport Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lvtransport-web-production
  cancel-in-progress: false

jobs:
  build:
    name: Build public website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @lvtransport/web build

      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: lvtransport-web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy website to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download website build
        uses: actions/download-artifact@v4
        with:
          name: lvtransport-web-dist
          path: dist/

      - name: Deploy static files over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_USER VPS_PATH VPS_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository secret $name is missing or unavailable to this workflow."
              exit 1
            fi
          done

          VPS_PORT="${VPS_PORT:-22}"
          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "::error::VPS_PORT must be a valid TCP port."
            exit 1
          fi

          if [[ ! "$VPS_PATH" =~ ^/var/www/[A-Za-z0-9._/-]+$ || "$VPS_PATH" == *"/../"* || "$VPS_PATH" == */.. ]]; then
            echo "::error::VPS_PATH must be a safe absolute path under /var/www."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/lvtp_deploy"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/lvtp_deploy"
          chmod 600 "$HOME/.ssh/lvtp_deploy"

          if [[ -n "$VPS_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH="ssh -i $HOME/.ssh/lvtp_deploy -p $VPS_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          TARGET="$VPS_USER@$VPS_HOST"

          $SSH "$TARGET" "sudo -n test -s '$VPS_PATH/index.html'"
          rsync -rltz --delete --delay-updates \
            --rsync-path="sudo -n rsync" \
            -e "$SSH" \
            dist/ "$TARGET:$VPS_PATH/"

          $SSH "$TARGET" "sudo -n nginx -t && sudo -n systemctl reload nginx && sudo -n test -s '$VPS_PATH/index.html'"
          curl --fail --silent --show-error --max-time 30 https://lvtransport.be/ -o /dev/null
