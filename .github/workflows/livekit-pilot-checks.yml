name: LiveKit local pilot checks
on:
  pull_request:
    paths:
      - 'experiments/livekit-pilot/**'
      - '.github/workflows/livekit-pilot-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and localhost token tests
        run: |
          cd experiments/livekit-pilot
          node --check server.mjs
          node --check client.js
          node --test server.test.mjs
