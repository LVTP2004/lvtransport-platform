name: LVTP Web Build Validation

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application types
        run: pnpm run typecheck

      - name: Run Node tests
        run: >-
          node --import tsx --test tests/*.test.mjs
          apps/api/src/modules/payments/staging-payments.test.ts
          apps/api/src/auth/services/firebase-staging.test.ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python tests
        run: python3 -m unittest discover -s tests

      - name: Build applications
        run: pnpm run build
