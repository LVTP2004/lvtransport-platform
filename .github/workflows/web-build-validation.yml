name: LVTP Web Build Validation

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  validate-web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate frontend build
        run: pnpm --filter @lvtransport/web build

      - name: Build summary
        run: |
          echo 'LVTP frontend build validation completed.'
          echo 'Routes expected:'
          echo '/booking/'
          echo '/tracking/'
          echo '/driver/'
          echo '/admin/'
