name: Spec Guard Approval Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/spec-guard-approval-tests.yml'
      - 'scripts/spec_guard_approval.py'
      - 'scripts/test_spec_guard_approval.py'

permissions:
  contents: read

jobs:
  spec-guard-approval-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify receipts using synthetic signing keys
        run: python3 -m unittest discover -s scripts -p test_spec_guard_approval.py -v
